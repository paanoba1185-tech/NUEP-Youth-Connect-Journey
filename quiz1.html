<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don Juan Alvear Quiz</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mut:#7a6e64;--ac:#8a5a2b;--ok:#2e7d4f;--bad:#b3392f;--bd:#e4dccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1814;--card:#262019;--tx:#f1eadf;--mut:#a99d90;--ac:#d9a066;--ok:#5fc08a;--bad:#e87c72;--bd:#3a3229}}
:root[data-theme="dark"]{--bg:#1c1814;--card:#262019;--tx:#f1eadf;--mut:#a99d90;--ac:#d9a066;--ok:#5fc08a;--bad:#e87c72;--bd:#3a3229}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
.w{max-width:620px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:.2em 0}.sub{color:var(--mut);font-family:system-ui,sans-serif;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
input[type=text]{width:100%;box-sizing:border-box;padding:12px;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:10px 0}
button{font-family:system-ui,sans-serif;font-size:1rem;padding:12px 18px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;width:100%}
button:disabled{opacity:.4}
.q{font-weight:bold;margin-bottom:10px}
label{display:block;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;margin:7px 0;cursor:pointer;font-family:system-ui,sans-serif;font-size:.95rem}
label:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
label input{margin-right:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.big{font-size:3rem;text-align:center;margin:6px 0}.pass{color:var(--ok)}.fail{color:var(--bad)}
.c{text-align:center}.rv{font-family:system-ui,sans-serif;font-size:.9rem;margin:10px 0;padding-left:10px;border-left:3px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.9rem}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
.hide{display:none}
</style></head><body><div class="w">
<h1>Don Juan Alvear Quiz</h1>
<div class="sub">Based on the Don Juan Alvear video · 10 questions · Pass: 8/10</div>

<div id="start" class="card">
 <div><b>Enter your Facebook name</b> exactly as it appears on your Facebook profile. Nicknames or other names are not accepted, and you can only take this quiz once. Each question has 30 seconds, and you cannot go back.</div>
 <input type="text" id="nm" placeholder="Facebook name" maxlength="60" autocomplete="off">
 <label style="border:0;padding:4px 0"><input type="checkbox" id="ck">I confirm this is my exact Facebook name.</label>
 <button id="go" disabled>Start Quiz</button>
</div>

<div id="quiz" class="hide">
 <div class="bar"><i id="pb" style="width:0"></i></div>
 <div class="card"><div id="tm" class="sub" style="font-weight:bold"></div><div class="q" id="qt"></div><div id="ops"></div>
 <button id="nx" disabled>Next</button></div>
</div>

<div id="res" class="hide">
 <div class="card c"><div id="rn" class="sub"></div><div class="big" id="rs"></div><div id="rv" style="font-size:1.3rem;font-weight:bold"></div><div id="sv" class="sub" style="margin-top:10px"></div></div>
 <div class="hide"><div id="rev"></div></div>
</div>

</div>
<script>const Q=[{q:"The 100th anniversary directory listed Juan Alvear as President General for which years?",o:["1901–1908", "1905–1908", "1909–1919", "1910–1912"],a:1,e:"The KKEP website said 'No records available' for 1901–1908; the directory listed Alvear for 1905–1908."},
{q:"In whose tomb do Don Juan Alvear's remains lie?",o:["The tomb of his parents, Pedro Alvear and Maria Erfe", "The tomb of his wife, Panchacola", "The tomb of Agustin dela Rosa", "The tomb of the parents of Chrisforo Alvear Ursais: Ursais Jr. and Ester Alvear Ursais"],a:3,e:"His remains are in the tomb of Ursais Jr. and Ester Alvear Ursais."},
{q:"What does the statue of Don Juan Alvear hold?",o:["Cane in the left hand, Holy Bible in the right", "A scroll in the right hand, a sword in the left", "Cane in the right hand, Holy Bible in the left", "The Holy Bible in both hands"],a:2,e:"Right hand: cane; left hand: Holy Bible."},
{q:"Which is the correct order of his public service?",o:["Governor (1910–1912) → Mayor (1899) → Representative (1907–1910)", "Mayor of San Fabian (1899) → Representative of the 3rd District (1907–1910) → Governor of Pangasinan (1910–1912)", "Representative (1899) → Mayor (1907–1910) → Governor (1910–1912)", "Mayor (1899) → Governor (1907–1910) → Representative (1910–1912)"],a:1,e:"Mayor 1899, Representative 1907–1910, Governor 1910–1912."},
{q:"After his wife Panchacola died despite his prayers to the idols, what did he do?",o:["He built a church for the idols", "He burned all the idols in his house", "He sold the idols to pay for a school", "He moved the idols to Manila"],a:1,e:"He burned all the idols; the Holy Spirit then guided him to form a fellowship."},
{q:"According to the Centro's biography, in what year was it registered in the Bureau of Commerce?",o:["1901", "1903", "1899", "1905"],a:3,e:"1905. (1901: founded. 1903: the S.E.C. merging story.)"},
{q:"His titled land of 8.9326 hectares now partly holds which three places?",o:["Municipal hall, plaza and school", "Provincial Capitol, hospital and market", "Library, cemetery and church", "Fishpond, centro and plaza"],a:0,e:"Municipal hall, plaza and school."},
{q:"Which doctrine belongs to Bro. Agustin dela Rosa?",o:["Hacia Dios por la Ciencia y El Amor", "Sin caridad no hay salvacion possible", "Hacia Dios por la Luz y El Amor", "Ciencia Oculta"],a:1,e:"Dela Rosa: 'Sin caridad no hay salvacion possible' (without charity there is no salvation)."},
{q:"Which two bills did he author as representative?",o:["University of Santo Tomas and Philippine General Hospital", "University of the Philippines and the Provincial Capitol", "Jose Rizal College and Philippine General Hospital", "University of the Philippines and Philippine General Hospital"],a:3,e:"UP (scholarships for poor bright students) and PGH (to help the poor)."},
{q:"Which statement about his birth and death is correct?",o:["Born July 21, 1864 in San Fabian; died Dec. 5, 1918 at PGH, Manila, at age 54", "Born July 21, 1864 in Manila; died Dec. 5, 1918 in San Fabian", "Born Dec. 5, 1864 in San Fabian; died July 21, 1918 at PGH", "Born July 21, 1864 in San Fabian; died Dec. 5, 1918 at age 64"],a:0,e:"Born July 21, 1864, San Fabian; died Dec. 5, 1918, PGH Manila, age 54."}
];
const $=id=>document.getElementById(id);
let name="",i=0,sel=[],sw=0,inQ=false,T=null,left=0;
function esc(s){const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&inQ)sw++});
const chk=()=>$('go').disabled=!($('nm').value.trim().length>=2&&$('ck').checked);$('nm').oninput=chk;$('ck').onchange=chk;
function blocked(prev){$('start').innerHTML='<b>You have already taken this quiz.</b><div class="sub" style="margin-top:8px">Only one attempt is allowed. Recorded result: '+prev.score+'/10 ('+(prev.passed?'Passed':'Not passed')+')</div>'}
$('go').onclick=async()=>{name=$('nm').value.trim();$('go').disabled=true;$('go').textContent='Checking\u2026';
 let prev=null;try{const l=localStorage.getItem('alvearDone');if(l)prev=JSON.parse(l)}catch(e){}
 if(prev){blocked(prev);return}
 Q.forEach(q=>{q.s=q.o.map((t,k)=>({t,k})).sort(()=>Math.random()-.5)});Q.sort(()=>Math.random()-.5);
 inQ=true;$('start').classList.add('hide');$('quiz').classList.remove('hide');show()};
function tick(){$('tm').textContent='\u23f1 '+left+'s';if(left<=0){adv();return}left--}
function startT(){clearInterval(T);left=30;tick();T=setInterval(tick,1000)}
function adv(){clearInterval(T);const c=document.querySelector('input[name=o]:checked');sel[i]=c?+c.value:-1;if(++i<Q.length)show();else finish()}
function show(){const q=Q[i];$('qt').textContent=(i+1)+". "+q.q;$('pb').style.width=(i/Q.length*100)+"%";
 $('ops').innerHTML=q.s.map(x=>`<label><input type="radio" name="o" value="${x.k}">${esc(x.t)}</label>`).join("");startT();
 $('nx').disabled=true;$('nx').textContent=i==Q.length-1?"Finish":"Next";
 document.querySelectorAll('input[name=o]').forEach(r=>r.onchange=()=>$('nx').disabled=false)}
$('nx').onclick=adv;
async function finish(){inQ=false;clearInterval(T);let s=0;Q.forEach((q,k)=>{if(sel[k]===q.a)s++});const p=s>=8;
 $('quiz').classList.add('hide');$('res').classList.remove('hide');
 $('rn').textContent=name;$('rs').textContent=s+" / 10";$('rs').className="big "+(p?"pass":"fail");
 $('rv').textContent=p?"PASSED \u2713":"NOT PASSED \u2717 (need 8/10)";$('rv').className=p?"pass":"fail";
 try{localStorage.setItem('alvearDone',JSON.stringify({name,score:s,passed:p}))}catch(e){}
 const msg="Don Juan Alvear Quiz\nName: "+name+"\nScore: "+s+"/10 ("+(p?"PASSED":"NOT PASSED")+")\nTab switches: "+sw;
 $('sv').innerHTML='Send this result to your coordinator:<br><br><button id="sh">Share / Send result</button><div class="sub" id="msg" style="white-space:pre-line;margin-top:10px;text-align:left"></div>';
 $('msg').textContent=msg;
 $('sh').onclick=async()=>{try{if(navigator.share){await navigator.share({text:msg});return}}catch(e){}try{await navigator.clipboard.writeText(msg);$('sh').textContent='Copied! Paste it in Messenger'}catch(e){$('sh').textContent='Please screenshot this screen'}};
}
</script></body></html>
