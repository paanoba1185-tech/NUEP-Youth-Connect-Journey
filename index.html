<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUEP Youth Connect – Journey Across the Philippines</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--card:#fff;--ink:#1d2a2f;--mute:#6b7a80;--line:#e2ddd0;--sea:#cfe6ee;--land:#dcd6bf;--accent:#0f766e;--gold:#d99a1e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--card:#182428;--ink:#eef3f1;--mute:#93a5aa;--line:#2a3a3f;--sea:#12303a;--land:#2c3a33;--accent:#2dd4bf;--gold:#f2b84b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1d;--card:#182428;--ink:#eef3f1;--mute:#93a5aa;--line:#2a3a3f;--sea:#12303a;--land:#2c3a33;--accent:#2dd4bf;--gold:#f2b84b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:0 auto;padding-bottom:84px}
header{padding:16px 16px 8px}h1{margin:0;font-size:19px;line-height:1.2}.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 16px}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s}
.big{font-size:28px;font-weight:700}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:6px 0;border-radius:10px}nav button b{display:block;font-size:20px}nav button.on{color:var(--accent);font-weight:600}
button.pri{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600}
.q{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font:inherit;color:var(--ink)}
.q.done{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}.q:disabled{opacity:.5}
.dot{width:14px;height:14px;border-radius:50%}.chk{margin-left:auto;font-size:20px}
.mapwrap{margin:8px 16px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}svg{display:block;width:100%;height:auto}
.land{fill:var(--land)}.lbl{font-size:9px;fill:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cr{text-align:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:12px}
.cr.lock{opacity:.35;filter:grayscale(1)}.gem{font-size:30px;display:block}
.pl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.pl:last-child{border:0}
.av{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.tag{font-size:11px;background:var(--line);border-radius:6px;padding:1px 6px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:9;padding:20px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:10px 0}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;text-align:center}
</style></head><body>
<header><h1>🧭 NUEP Youth Connect · Season 3</h1><div class="sub">Journey Across the Philippines · Batanes to Mt. Apo</div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>const START=new Date(2026,11,7),WEEKS=14;
const QUESTS=[{n:"Life Lesson Video",d:"Monday",c:"#3b82f6"},{n:"Family Quest",d:"Wednesday",c:"#22c55e"},{n:"Bible Reflection",d:"Friday",c:"#eab308"},{n:"Sunday Reflection",d:"Sunday",c:"#a855f7"}];
const D=[["Batanes",121.9,20.45],["Banaue Rice Terraces",121.06,16.92],["Vigan",120.39,17.57,1],["Mayon Volcano",123.69,13.26],["Boracay",121.92,11.97],["Chocolate Hills",124.14,9.83,2],["Cebu",123.89,10.32],["Tacloban – San Juanico Bridge",125.0,11.24],["Camiguin",124.72,9.17,3],["Siargao",126.05,9.85],["Davao",125.46,7.07],["Mt. Apo Summit",125.27,6.99,4]].map((d,i)=>({name:d[0],x:(d[1]-119)*40,y:(21-d[2])*40,ms:d[3]||0,at:(i+1)*5,i}));
const BASE={name:"Basecamp",x:(120.98-119)*40,y:(21-14.6)*40,at:0};
const ROUTE=[BASE,...D];const COLORS=["#e11d48","#2563eb","#16a34a","#d97706","#9333ea","#0891b2","#db2777","#65a30d","#ea580c","#4f46e5"];
const GEM=["💎","🔷","💠","🔮","🟢","🟡","🟠","🔴","🟣","⚪","🟤","🔶"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function steps(p){let t=0;const w=(p&&p.weeks)||{};for(const k in w){const a=w[k]||[];const n=a.filter(Boolean).length;t+=Math.min(5,n+(n===4?1:0))}return Math.min(60,t)}
function curWeek(){const d=Math.floor((Date.now()-START)/864e5);return d<0?0:Math.min(WEEKS,Math.floor(d/7)+1)}
function pos(s){const f=Math.min(s,60)/5,i=Math.min(Math.floor(f),11),t=f-i,a=ROUTE[i],b=ROUTE[i+1];return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}
function loc(s){const i=Math.floor(Math.min(s,60)/5);return i===0?"Basecamp":s>=60?"Mt. Apo Summit 🏔️":"Heading to "+D[i].name}
function col(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function list(){return Object.entries(players).map(([id,p])=>({id,p,s:steps(p)})).sort((a,b)=>b.s-a.s||(a.p.name||"").localeCompare(b.p.name||""))}
function iu(p){return p&&p.photo?p.photo:""}
function avH(p,id){return iu(p)?`<img class="av" alt="" src="${iu(p)}" style="object-fit:cover;flex:none">`:`<span class="av" style="background:${col(id||"x")};flex:none">${esc((p&&p.name||"?")[0].toUpperCase())}</span>`}
function imgG(x,y,r,img,n){return img?`<clipPath id="c${n}"><circle cx="${x}" cy="${y}" r="${r-.5}"/></clipPath><image href="${img}" x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" clip-path="url(#c${n})" preserveAspectRatio="xMidYMid slice"/>`:""}
function mapSVG(){
 let s=`<svg viewBox="0 0 330 600" role="img" aria-label="Map of the Philippines journey">`;
 s+=`<path class="land" d="M70 20 L110 10 L125 60 L110 110 L120 170 L170 200 L190 250 L150 280 L120 250 L95 200 L60 150 L55 90Z"/><path class="land" d="M120 170 L200 160 L230 200 L200 215 L190 250 L150 280 L120 250Z"/><path class="land" d="M85 255 L125 240 L150 300 L130 340 L100 310Z"/><path class="land" d="M170 270 L260 250 L270 310 L200 330 L165 310Z"/><path class="land" d="M190 340 L250 330 L275 400 L270 470 L215 490 L190 440Z"/>`;
 s+=`<polyline points="${ROUTE.map(r=>r.x.toFixed(0)+","+r.y.toFixed(0)).join(" ")}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
 const my=myS();
 ROUTE.forEach((r,i)=>{if(!i){s+=`<text x="${r.x}" y="${r.y-8}" class="lbl" text-anchor="middle">⛺ Basecamp</text>`;return}
  const d=D[i-1],got=my>=d.at,m=d.ms;
  s+=`<g data-d="${i-1}" style="cursor:pointer"><circle cx="${r.x}" cy="${r.y}" r="${m?9:6}" fill="${got?"var(--gold)":"var(--card)"}" stroke="${m?"var(--gold)":"var(--accent)"}" stroke-width="2"/><text x="${r.x}" y="${r.y+3}" font-size="${m?9:7}" text-anchor="middle">${got?"✓":(m?"⭐":"")}</text><text x="${r.x+(r.x>240?-12:12)}" y="${r.y+3}" class="lbl" text-anchor="${r.x>240?"end":"start"}">${esc(d.name.split(" – ")[0].replace(" Rice Terraces",""))}</text></g>`});
 list().forEach((q,k)=>{if(q.id===uid)return;const p=pos(q.s),j=(k%5-2)*3;
  s+=`<g data-p="${q.id}" style="cursor:pointer"><circle cx="${(p.x+j).toFixed(1)}" cy="${(p.y-j).toFixed(1)}" r="7" fill="${col(q.id)}" stroke="#fff" stroke-width="1.5"/><text x="${(p.x+j).toFixed(1)}" y="${(p.y-j+3).toFixed(1)}" font-size="8" fill="#fff" text-anchor="middle" font-weight="700">${esc((q.p.name||"?")[0].toUpperCase())}</text>${imgG((p.x+j).toFixed(1),(p.y-j).toFixed(1),7,iu(q.p),k)}</g>`});
 if(me){const p=pos(my);s+=`<g data-p="${uid}"><circle cx="${p.x}" cy="${p.y}" r="13" fill="none" stroke="var(--gold)" stroke-width="2.5"><animate attributeName="r" values="11;16;11" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="${p.x}" cy="${p.y}" r="9" fill="${col(uid)}" stroke="#fff" stroke-width="2"/><text x="${p.x}" y="${p.y+3.5}" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">${esc((me.name||"Y")[0].toUpperCase())}</text>${imgG(p.x,p.y,9,iu(me),"me")}</g>`}
 return s+"</svg>"}
function header(T=me){if(!T)return"";const s=steps(T),nx=Math.min(60,(Math.floor(s/5)+1)*5),m=[15,30,45,60].find(x=>x>s);
 return `<div class="card"><div class="row"><div><div class="row">${avH(T,T===me?uid:mp)}<div class="sub">${esc(T.name)}</div></div><div class="big">${s}<span class="sub"> / 60 steps</span></div></div><div class="sp"></div><div style="text-align:right"><div style="font-size:26px">${GEM[0]} ${Math.floor(s/5)}</div><div class="sub">crystals</div></div></div><div class="bar"><i style="width:${s/60*100}%"></i></div><div class="sub">📍 ${loc(s)}${m?` · ${m-s} steps to ${m===60?"the summit":"milestone"} ⭐`:""}</div></div>`}

function myS(){return steps(me)}

function mk(name,cells){const weeks={};for(let w=1;w<=WEEKS;w++){const v=(cells[w-1]||"").toUpperCase();if(v.trim())weeks[w]=["M","W","F","S"].map(c=>v.includes(c)?1:0)}return{name,weeks,photo:PHOTOS[name.toLowerCase()]||""}}

function init(){let st0=null;try{st0=localStorage.getItem("nuep_data")}catch(e){}
 const h=location.hash.match(/d=([^&]+)/),a=h?dec(h[1]):null,b=st0?dec(st0):null;
 if(a&&(!b||a.t>=b.t)){apply(a);keep(h[1])}else if(b)apply(b);else{NAMES.forEach(n=>players[slug(n)]=mk(n,[]));apply({p:[]});players={};NAMES.forEach(n=>players[slug(n)]=mk(n,[]));me=uid?players[uid]||null:null;mp=Object.keys(players)[0]}}
function link(){return location.href.split("#")[0]+"#d="+enc()}
function myS(){return steps(me)}
function pickHTML(L){return `<div class="modal"><div class="card" style="margin:0;width:100%;max-width:380px;max-height:85vh;overflow:auto"><h1>Welcome, Adventurer! 🎒</h1><p class="sub">Who are you? Tap your name to see your journey.</p>${L.map(q=>`<button class="q" data-pick="${q.id}">${avH(q.p,q.id)}<b>${esc(q.p.name)}</b></button>`).join("")}</div></div>`}
function view(){
 if(tab==="map")return header()+`<div class="mapwrap">${mapSVG()}</div><div class="card" id="info"><span class="sub">Tap a traveller or a destination on the map.</span></div>`;
 if(tab==="quest"){const T=master?players[mp]:me;if(!T)return"";const c=curWeek(),a=(T.weeks&&T.weeks[wk])||[0,0,0,0],n=a.filter(Boolean).length,ws=Math.min(5,n+(n===4?1:0));
  let h=(master?`<div class="card"><div class="sub">Updating progress for</div><select id="mp" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">${list().map(q=>`<option value="${q.id}" ${q.id===mp?"selected":""}>${esc(q.p.name)} (${q.s} steps)</option>`).join("")}</select></div>`:"")+header(T)+`<div class="card"><div class="row"><button class="pri" data-w="-1" ${wk<=1?"disabled":""}>‹</button><div class="sp" style="text-align:center"><b>Week ${wk}</b><div class="sub">${wk===c?"This week":wk>c?"Not open yet":"Past week"} · ${ws}/5 steps</div></div><button class="pri" data-w="1" ${wk>=WEEKS?"disabled":""}>›</button></div>`;
  if(c===0)h+=`<p class="sub" style="text-align:center">Quests open Dec 7, 2026 – ${Math.max(0,Math.ceil((START-Date.now())/864e5))} days to go! 🎒</p>`;
  QUESTS.forEach((q,i)=>{const t=master?"button":"div";h+=`<${t} class="q ${a[i]?"done":""}" ${master?`data-q="${i}"`:""}><span class="dot" style="background:${q.c}"></span><span><b>${q.n}</b><br><span class="sub">${q.d}</span></span><span class="chk">${a[i]?"✅":"⬜"}</span></${t}>`});
  return h+`<div class="sub">Complete a quest = 1 step. All 4 on time = +1 bonus step (max 5 per week).${master?"":" Your guide updates your progress."}</div></div>`}
 if(tab==="gems"){if(!me)return"";const s=steps(me);let h=header()+`<div class="card"><b>Your crystal collection</b><div class="sub" style="margin-bottom:10px">One crystal for every destination you reach. ⭐ Milestones unlock a reward 🎁</div><div class="grid">`;
  D.forEach((d,i)=>{const g=s>=d.at;h+=`<div class="cr ${g?"":"lock"}"><span class="gem">${GEM[i]}</span><b>${esc(d.name.split(" – ")[0].replace(" Rice Terraces",""))}</b><br>${d.ms?(d.ms===4?"🏆 Finale":"⭐ Milestone "+d.ms+" 🎁"):d.at+" steps"}</div>`});return h+"</div></div>"}
 const L=list();let h=`<div class="card"><b>Team progress</b><div class="sub">${L.length} adventurers on the trail</div>`;
 L.forEach((q,i)=>{h+=`<div class="pl"><span class="sub" style="width:18px">${i+1}</span>${avH(q.p,q.id)}<div class="sp"><b>${esc(q.p.name)}</b>${q.id===uid?' <span class="tag">you</span>':""}<div class="bar" style="height:6px;margin:4px 0"><i style="width:${q.s/60*100}%"></i></div><div class="sub">${loc(q.s)}</div></div><div style="text-align:right"><b>${q.s}</b><div class="sub">${GEM[0]} ${Math.floor(q.s/5)}</div></div>${master?`<button data-del="${q.id}" style="border:0;background:none;font-size:16px">${delArm===q.id?"⚠️ Confirm":"🗑️"}</button>`:""}</div>`});
 if(master)h+=`<div style="margin-top:12px"><input id="newp" maxlength="24" placeholder="Add participant name"><button class="pri" id="addp">Add participant</button></div>`;
 h+="</div>";
 if(master)h+=`<div class="card"><b>📤 Share progress</b><div class="sub" style="margin:4px 0 10px">After updating, send participants the link (or the code if they use the downloaded file).</div><button class="pri" id="cplink">Copy link</button> <button class="pri" id="cpcode" style="background:var(--gold)">Copy code</button><textarea id="code" readonly rows="3" style="width:100%;margin-top:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:11px">${enc()}</textarea></div>`;
 h+=`<div class="sub" style="text-align:center;margin:10px 16px"><a href="#" id="sw" style="color:var(--accent)">Not you? Switch</a> · <a href="#" id="hv" style="color:var(--accent)">Got an update code?</a> · <a href="#" id="gm" style="color:var(--accent)">${master?"Exit":"🔒"} Game master</a></div>`;
 if(open==="code")h+=`<div class="card"><b>Paste update code or link</b><input id="cin" placeholder="Paste here"><button class="pri" id="capply">Apply update</button></div>`;
 if(open==="pin")h+=`<div class="card"><b>Game master PIN</b><input id="pin" type="password" placeholder="PIN"><button class="pri" id="pgo">Unlock</button></div>`;
 return h}
function render(){
 if(!me&&!master){$("#app").innerHTML=pickHTML(list());$("#nav").innerHTML="";document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{uid=b.dataset.pick;try{localStorage.setItem("nuep_me",uid)}catch(e){}me=players[uid];render()});return}
 $("#app").innerHTML=view();
 $("#nav").innerHTML=[["map","🗺️","Map"],["quest","📅","Quests"],["gems","💎","Crystals"],["team","👥","Team"]].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?"on":""}"><b>${t[1]}</b>${t[2]}</button>`).join("");
 const on=(q,f)=>document.querySelectorAll(q).forEach(f);
 on("[data-t]",b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
 on("[data-w]",b=>b.onclick=()=>{wk=Math.max(1,Math.min(WEEKS,wk+ +b.dataset.w));render()});
 const ps=$("#mp");if(ps)ps.onchange=()=>{mp=ps.value;render()};
 on("[data-q]",b=>b.onclick=()=>{const T=players[mp];if(!T)return;const i=+b.dataset.q,before=steps(T),a=((T.weeks||{})[wk]||[0,0,0,0]).slice();a[i]=a[i]?0:1;T.weeks={...T.weeks,[wk]:a};keep();render();const after=steps(T);if(after>before){const o=Math.floor(before/5),n=Math.floor(after/5);toast(n>o?`${GEM[n-1]} Crystal! Reached ${D[n-1].name.split(" – ")[0]}`:"👣 +1 step")}});
 const ap=$("#addp");if(ap)ap.onclick=()=>{const v=$("#newp").value.trim();if(!v)return;players[slug(v)]=mk(v,[]);if(!mp)mp=slug(v);keep();render()};
 on("[data-del]",b=>b.onclick=()=>{const id=b.dataset.del;if(delArm!==id){delArm=id;render();setTimeout(()=>{if(delArm===id){delArm=null;render()}},4000);return}delArm=null;delete players[id];if(mp===id)mp=Object.keys(players)[0]||null;if(uid===id){uid=null;me=null}keep();render()});
 const cp=(t,m)=>{const ta=$("#code");const done=()=>toast(m);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>{ta.value=t;ta.select();toast("Press and hold the box to copy")});else{ta.value=t;ta.select();toast("Press and hold the box to copy")}};
 const c1=$("#cplink");if(c1)c1.onclick=()=>cp(link(),"Link copied ✅");const c2=$("#cpcode");if(c2)c2.onclick=()=>cp(enc(),"Code copied ✅");
 const sw=$("#sw");if(sw)sw.onclick=e=>{e.preventDefault();try{localStorage.removeItem("nuep_me")}catch(x){}uid=null;me=null;render()};
 const hv=$("#hv");if(hv)hv.onclick=e=>{e.preventDefault();open=open==="code"?"":"code";render()};
 const gm=$("#gm");if(gm)gm.onclick=e=>{e.preventDefault();if(master){master=false;try{localStorage.removeItem("nuep_master")}catch(x){}if(!me)uid=null;render()}else{open=open==="pin"?"":"pin";render()}};
 const ca=$("#capply");if(ca)ca.onclick=()=>{let v=$("#cin").value.trim();const m=v.match(/d=([^&\s]+)/);if(m)v=m[1];const o=dec(v);if(!o){toast("That code doesn’t look right");return}apply(o);keep(v);open="";toast("Progress updated ✅");render()};
 const pg=$("#pgo");if(pg)pg.onclick=()=>{if($("#pin").value===PIN){master=true;try{localStorage.setItem("nuep_master","1")}catch(x){}open="";tab="quest";toast("Game master mode on 🛠️");render()}else toast("Wrong PIN")};
 on("[data-p]",g=>g.onclick=()=>{const q=players[g.dataset.p];if(!q)return;const s=steps(q);$("#info").innerHTML=`<b>${esc(q.name)}</b>${g.dataset.p===uid?' <span class="tag">you</span>':""}<div class="sub">${s} steps · ${GEM[0]} ${Math.floor(s/5)} crystals · ${loc(s)}</div>`});
 on("[data-d]",g=>g.onclick=()=>{const d=D[+g.dataset.d],n=list().filter(q=>q.s>=d.at).length;$("#info").innerHTML=`<b>${GEM[d.i]} ${esc(d.name)}</b><div class="sub">${d.ms?(d.ms===4?"🏆 Grand Finale":"⭐ Milestone "+d.ms+" · reward 🎁"):"Destination "+(d.i+1)} · unlocks at ${d.at} steps · ${n} adventurer${n===1?"":"s"} have arrived</div>`})}
init();render();
</script></body></html>
