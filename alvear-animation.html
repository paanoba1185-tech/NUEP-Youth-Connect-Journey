<div id="intro"><div style="font-size:3.6rem">🕊️</div><h1>Ang Kasaysayan ni Don Juan Alvear</h1>

<script>
const IM={},S=[{"i": [0, 13], "tl": "Ang Simulain ng Pagkakatatag ng Union Espiritista Cristiana de Filipinas, noong 1900. Isang makatotohanang pananaliksik ng mga kabataan ng Centro Labuad ning Veron, Marso 24, 2009.", "en": "The Beginnings of the Union Espiritista Cristiana de Filipinas, around 1900. A factual research by the youth of Centro Labuad ning Veron, March 24, 2009."}, {"i": [1, 2, 3, 4], "tl": "Noong Marso 21, 2009, may tanong ang mga kabataan: ano ba ang tama? Sa website ng Kapatiran ng Kabataang Espiritista ng Pilipinas, nakasulat na walang tala para sa Presidente Heneral mula 1901 hanggang 1908. Sa Centro La Perseverancia sa San Fabian, ang kauna-unahang centro sa Pilipinas, ipinakita ni Ginoong Benjamin Imbuido ang direktoryo ng ika-100 anibersaryo. Nakatala roon si Juan Alvear bilang Presidente Heneral mula 1905 hanggang 1908.", "en": "On March 21, 2009, the youth asked: what is correct? The KKEP website says there are no records of a President General from 1901 to 1908. At Centro La Perseverancia in San Fabian, the first centro in the Philippines, Bro. Benjamin Imbuido showed the 100th anniversary directory. It lists Juan Alvear as President General from 1905 to 1908."}, {"i": [8, 7, 11, 12], "tl": "Kinabukasan, Marso 22, nagtungo sila sa dating bahay ni Don Juan Alvear sa kanto ng Alvear Street at Erfe Street. Nalaglag na ang bahay dahil sa anay, at napakataas ng bakod na yero. Habang paalis na sila, tinawag sila ng isang lalaki. Siya pala ay apo ni Don Juan Alvear, si Ginoong Chrisforo Alvear Ursais.", "en": "The next day, March 22, they went to Don Juan Alvear's old house at the corner of Alvear Street and Erfe Street. The house had collapsed from termite damage, and the zinc fence was very tall. As they were leaving, a man called out to them. He was a grandson of Don Juan Alvear, Bro. Chrisforo Alvear Ursais."}, {"i": [10, 14, 15, 17, 19], "tl": "Ipinakita ng apo ang mga naiwang gamit, tulad ng aparador. Ipinakita rin niya ang larawan ni Don Juan Alvear noong siya ay gobernador, mula 1910 hanggang 1912. May mga papeles pa ng kanyang ari-arian na isandaang taon na, kasama ang kanyang lagda.", "en": "The grandson showed the things left behind, such as the wardrobe. He also showed the portrait of Don Juan Alvear as governor, from 1910 to 1912. There were hundred-year-old property papers too, bearing his signature."}, {"i": [22, 20, 21], "tl": "Ang titulado niyang lupa na 8.9326 ektarya ay bahagyang kinatitirikan ngayon ng munisipyo ng San Fabian, ng plaza at ng eskwelahan. Nakita rin nila ang bakanteng lote sa Alvear Extension kung saan siya nanirahan noong bata pa. Katabi nito ang palaisdaan na kalahati ay pag-aari niya.", "en": "His titled land of 8.9326 hectares now partly holds San Fabian's municipal hall, the plaza and the school. They also saw the vacant lot on Alvear Extension where he lived as a child. Next to it is the fishpond, half of which he owned."}, {"i": [25, 26, 23, 24], "tl": "Pagkatapos, dinalaw nila ang kanyang puntod sa sementeryo. Ang kanyang mga labi ay nasa puntod ng mga magulang ni Ginoong Ursais, sina Ursais Jr. at Ester Alvear Ursais. Sa tabi nito ay may tumubong halamang puno ng Agdao, na ayon sa apo ay nakapagpapagaling ng may pananampalataya.", "en": "Then they visited his grave in the cemetery. His remains lie in the tomb of Bro. Ursais's parents, Ursais Jr. and Ester Alvear Ursais. Beside it grows an Agdao plant, which, according to his grandson, can heal those who have faith."}, {"i": [27, 28, 29, 30], "tl": "Sarado ang library dahil wala ang caretaker, kaya nagtungo sila sa harap ng munisipyo upang makita ang rebulto. Ayon sa apo, hawak ng kanang kamay ang tungkod, at ng kaliwa ang Banal na Kasulatan. Ito raw ay tanda na siya ang pundador ng espiritismo sa Pilipinas at isang kagalang-galang na gobernador.", "en": "The library was closed because the caretaker was away, so they went to the front of the municipal hall to see the statue. According to the grandson, the right hand holds a cane and the left hand holds the Holy Bible. This is said to show that he was the founder of Spiritism in the Philippines and a respected governor."}, {"i": [31, 32, 13], "tl": "Ikinuwento rin ng apo ang ilang salaysay ng pamilya. May isang maysakit na tinanggihan ng ospital dahil walang pambayad. Nanalangin siya at nakipag-usap sa yumaong pundador, at ayon sa kuwento ay gumaling siya. Sinasabi rin na kapag walang pera ang mga anak ni Don Juan, nanalangin sila sa kanilang ama at may makikita silang perang nakatago sa bahay. Ang orihinal na bahay niya ay ginawang paaralan, ang San Fabian College.", "en": "The grandson also shared some family stories. A sick man, refused by the hospital because he could not pay, prayed and spoke to the late founder, and according to the story he was healed. It is also said that when his children had no money, they prayed to their father and found money hidden in the house. His original house was turned into a school, San Fabian College."}, {"i": [0, 13, 3], "tl": "Ayon sa talambuhay, isinilang si Don Juan Erfe Alvear noong Hulyo 21, 1864, sa San Fabian, Pangasinan, anak nina Pedro Alvear at Maria Erfe. Nagtapos siya ng Bachelor of Arts, Pilosopiya at pagkapari sa Unibersidad ng Santo Tomas. Naging guro siya sa San Juan de Letran, at isa sa kanyang mga estudyante si Manuel L. Quezon. Pumanaw siya noong Disyembre 5, 1918, sa Philippine General Hospital sa Maynila, sa edad na limampu't apat.", "en": "According to his biography, Don Juan Erfe Alvear was born on July 21, 1864 in San Fabian, Pangasinan, to Pedro Alvear and Maria Erfe. He finished a Bachelor of Arts, Philosophy and Priesthood at the University of Santo Tomas. He taught at San Juan de Letran, and one of his students was Manuel L. Quezon. He died on December 5, 1918 at the Philippine General Hospital in Manila, at age fifty-four."}, {"i": [14, 13, 17], "tl": "Ikinasal siya sa isang Portugesa na si Panchacola. Nang mamatay ang kanyang asawa kahit nanalangin siya sa mga rebulto, sinunog niya ang lahat ng rebulto sa bahay. Ayon sa salaysay, ginabayan siya ng Espiritu Santo na bumuo ng samahan. Noong 1901, itinatag niya ang Espiritista. Noong 1905, kasama si Agustin dela Rosa, nabuo ang Union Espiritista Cristiana de Filipinas. Naging kapitan din siya ng Katipunan sa ilalim ni Emilio Aguinaldo. Ayon sa talambuhay ng Centro, nairehistro ito sa Bureau of Commerce noong 1905.", "en": "He married a Portuguese woman named Panchacola. When his wife died despite his prayers to the idols, he burned all the idols in his house. According to the account, the Holy Spirit then guided him to form a fellowship. In 1901 he founded the Espiritista. In 1905, together with Agustin dela Rosa, the Union Espiritista Cristiana de Filipinas was formed. He was also a captain of the Katipunan under Emilio Aguinaldo. According to the Centro's biography, it was registered in the Bureau of Commerce in 1905."}, {"i": [31, 32, 0], "tl": "Ayon sa mga matatanda ng Iglesia, noong mga animnapung taong gulang na siya, tuwing hapon ay nagdarasal siya sa isang bukid. Isang matanda ang nagmatyag at nakakita ng liwanag na higit pa sa liwanag ng araw. Nagpatayo sila ng gusaling ginamit na pagamutan. Nagtungo siya sa Maynila upang irehistro ang UECFI sa S.E.C., at dahil may nagpaparehistro rin doon ng ganoong samahan, pinag-isa nila ito noong 1903.", "en": "According to the elders of the Church, when he was about sixty, he went to pray in a field every afternoon. An old man watched him and saw a light brighter than the sun. They then built a building that was first used as a clinic. He went to Manila to register the UECFI with the S.E.C., and since others were registering a similar group there, they merged them in 1903."}, {"i": [29, 30, 4], "tl": "Noong 1899, siya ang kauna-unahang alkalde ng San Fabian. Mula 1907 hanggang 1910, kinatawan siya ng ikatlong distrito ng Pangasinan. Inakda niya ang batas para sa Philippine General Hospital upang matulungan ang mahihirap, at ang batas para sa Unibersidad ng Pilipinas na may scholarship para sa mga dukhang matalino. Mula 1910 hanggang 1912, siya ang gobernador ng Pangasinan, at ipinatayo niya ang Kapitolyo sa Lingayen.", "en": "In 1899 he was the first mayor of San Fabian. From 1907 to 1910 he represented the third district of Pangasinan. He authored the bill for the Philippine General Hospital to help the poor, and the bill for the University of the Philippines with scholarships for bright poor students. From 1910 to 1912 he was governor of Pangasinan, and he had the Provincial Capitol built in Lingayen."}, {"i": [23, 25, 13], "tl": "Maraming kuwento ng kanyang kapangyarihan ayon sa mga matatanda. Namigay siya ng palay sa nangangailangan, at ang nagsinungaling sa bilang ng anak ay hindi makaalis ang kamay sa sako. Ayon sa kuwento, lumakad siya sa ibabaw ng tubig upang iligtas ang batang nalulunod. Bago siya pumanaw, nagpaalam siya sa kanyang asawa at nahiga na naka-coat and tie. Sa kabaong, isang paro-paro ang paulit-ulit na lumitaw sa tapat ng kanyang puso. Nag-iwan siya ng mga aklat, kabilang ang Doktrina Espiritista at Ciencia Oculta.", "en": "The elders tell many stories of his powers. He gave palay to the needy, and a man who lied about the number of his children could not pull his hand off the sack. According to the story, he walked on water to save a drowning child. Before he died, he bid his wife goodbye and lay down in a coat and tie. In the coffin, a butterfly kept appearing over his heart. He left books, including the Doctrine of Spiritism and Ciencia Oculta."}, {"i": [0, 20, 28], "tl": "Ayon kay Bro. Pete Ferrer, mahirap ang pamilya ni Don Juan at maaga siyang naulila. Nagtrabaho siya sa Maynila hanggang kupkupin ng isang mayamang negosyante na nagpaaral sa kanya. Noong 1909, nanalo siya bilang gobernador, ang kauna-unahang inihalal na gobernador ng Pangasinan. Nagtatag siya ng mga paaralan, dahil naniniwala siyang edukasyon ang susi ng pag-unlad ng bansa. Ang ilan sa kanyang mga tagasunod ay naging kilalang faith healer.", "en": "According to Bro. Pete Ferrer, Don Juan's family was poor and he was orphaned early. He worked in Manila until a rich businessman took him in and sent him to school. In 1909 he won as governor, the first elected governor of Pangasinan. He founded schools, because he believed education was the key to the nation's progress. Some of his followers became well-known faith healers."}, {"i": [13, 14, 30], "tl": "Ang doktrina naman ni Bro. Agustin dela Rosa ay: Sin caridad no hay salvacion possible. Ibig sabihin, kung walang pag-ibig sa kapwa, walang kaligtasan. Ito ang doktrina ni Don Juan Alvear: Hacia Dios por la Ciencia y El Amor. Patungo sa Diyos sa pamamagitan ng agham at pag-ibig. Ang pananaliksik na ito ay gawa ng Kabataan Labuad ning Veron, Batch 2009, kasama sina Bro. Pedro Jimenez, Bro. Benjamin Imbuido, Bro. Marcelo Basbas at Lorence Juguilon. Salamat kina Bro. Chrisforo Alvear Ursais, Bro. Pete Ferrer, at sa Centro La Perseverancia.", "en": "Bro. Agustin dela Rosa's doctrine was: Sin caridad no hay salvacion possible. It means that without charity there is no salvation. This was Don Juan Alvear's doctrine: Hacia Dios por la Ciencia y El Amor. Towards God through science and love. This research was made by the Kabataan Labuad ning Veron, Batch 2009, with Bro. Pedro Jimenez, Bro. Benjamin Imbuido, Bro. Marcelo Basbas and Lorence Juguilon. Thanks to Bro. Chrisforo Alvear Ursais, Bro. Pete Ferrer, and Centro La Perseverancia."}];const sk=(a,b)=>`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="300" height="620" fill="url(#g)"/>`;

function rec(t,n,ex,ok,fail){if(!ex.length)return fail();const a=new Audio('audio/scene'+pad(n)+(lang==='en'?'_en':'')+'.'+ex[0]);a.play().then(()=>{if(t!==tk){a.pause();return}ok(a)}).catch(()=>{if(t===tk)rec(t,n,ex.slice(1),ok,fail)})}

function speak(s,t,nx){if(mode==='off')return timer(s,nx);const dv=window.speechSynthesis&&pick();

function tone(f,d,g,ty){const o=ctx.createOscillator(),a=ctx.createGain(),n=ctx.currentTime;o.type=ty;o.frequency.value=f;a.gain.setValueAtTime(0,n);a.gain.linearRampToValueAtTime(g,n+.06);a.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(a);a.connect(master);o.start(n);o.stop(n+d+.1)}

$('lg').onclick=()=>{lang=lang==='tl'?'en':'tl';go(idx)};
